buildscript {
    repositories {
        mavenCentral()
		maven {
		  url "https://plugins.gradle.org/m2/"
		}
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:4.1.0")
        classpath "com.github.jk1:gradle-license-report:3.1.4"
        classpath 'org.owasp:dependency-check-gradle:13.0.0'
    }
}


apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: "project-report"
apply plugin: "com.github.jk1.dependency-license-report"
apply plugin: 'org.owasp.dependencycheck'

bootJar {
    archiveBaseName = 'SpringPdfCreator'
    archiveVersion = '0.1.0'
}

repositories {
    mavenCentral()
}

sourceCompatibility = 17
targetCompatibility = 17

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation group: 'com.lmax', name: 'disruptor', version:'4.0.0'
    
    compileOnly("org.springframework.boot:spring-boot-devtools")  
    implementation("org.springframework.boot:spring-boot-starter-security")
	  implementation("org.springframework.boot:spring-boot-starter-web:4.1.0")
	  implementation 'org.springframework.boot:spring-boot-starter-log4j2:4.1.0'
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:4.1.0")
    implementation("org.springframework.boot:spring-boot-starter-data-rest:4.1.0")

    implementation("com.h2database:h2:2.1.214")
    implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.1.0'
    implementation group: 'com.microsoft.sqlserver', name: 'mssql-jdbc', version: '12.2.0.jre8'
    implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.1.0'
    implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.2'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-core', version: '4.0.1'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-impl', version: '4.0.1'
    implementation group: 'jakarta.activation', name: 'jakarta.activation-api', version: '2.1.3'
    implementation group: 'org.apache.tomcat', name: 'tomcat-dbcp', version: '11.0.24'
    implementation("org.springframework.boot:spring-boot-starter-websocket:4.1.0")
    implementation("org.webjars:webjars-locator-core")
    implementation("org.webjars:sockjs-client:1.5.1")
    implementation("org.webjars:stomp-websocket:2.3.4")
    implementation("org.webjars:bootstrap:5.3.8")
    implementation("org.webjars:jquery:3.6.1")
    testImplementation('org.springframework.boot:spring-boot-starter-test:4.1.0') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}
    implementation("org.springframework.boot:spring-boot-starter-activemq:4.1.0")
    implementation 'com.itextpdf:itext7-core:9.7.1'
    implementation 'com.itextpdf:kernel:9.7.1'
    implementation 'com.itextpdf:io:9.7.1'
    implementation 'com.itextpdf:layout:9.7.1'
    implementation 'com.itextpdf:forms:9.7.1'
    implementation 'com.itextpdf:pdfa:9.7.1'
    implementation 'com.itextpdf:sign:9.7.1'
    implementation 'com.itextpdf:barcodes:9.7.1'
    implementation 'com.itextpdf:font-asian:9.7.1'
    implementation 'com.itextpdf:hyph:9.7.1'
    implementation group: 'com.itextpdf', name: 'html2pdf', version: '6.2.1'
}
configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}
test {
	useJUnitPlatform()
}
